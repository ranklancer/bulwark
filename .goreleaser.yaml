# GoReleaser configuration for Bulwark's OWN releases (supply-chain dogfooding).
#
# Produces, for each tagged release: reproducible multi-arch binaries, a
# checksums file, a CycloneDX SBOM per artifact (syft), and keyless cosign
# signatures over the checksums (and thus transitively every artifact + SBOM).
# SLSA build provenance is generated by the release workflow (slsa-github-
# generator), which consumes the artifact hashes this config emits.
#
# Validated by `goreleaser check` in the release workflow. The dev box pins Go
# 1.22 (GOTOOLCHAIN=local); GoReleaser v2 needs Go >= 1.23, so it runs in CI, not
# on the box. Pin the goreleaser + syft + cosign versions in the workflow.
version: 2

project_name: bulwark

before:
  hooks:
    - go mod download

builds:
  - id: bulwark
    main: ./cmd/bulwark
    binary: bulwark
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: bulwark
    formats:
      - tar.gz
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

# Software Bill of Materials (CycloneDX JSON) per archive, via syft.
sboms:
  - id: archive-sbom
    artifacts: archive
    documents:
      - '{{ .ArtifactName }}.cyclonedx.json'
    cmd: syft
    args:
      - '$artifact'
      - '--output'
      - 'cyclonedx-json=$document'

# Keyless cosign signature over the checksums file. Requires OIDC in CI
# (id-token: write). Verifies with:
#   cosign verify-blob --certificate checksums.txt.pem \
#     --signature checksums.txt.sig \
#     --certificate-identity-regexp '^https://github.com/ranklancer/bulwark/.+' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     checksums.txt
signs:
  - id: cosign-keyless
    cmd: cosign
    signature: '${artifact}.sig'
    certificate: '${artifact}.pem'
    args:
      - sign-blob
      - '--yes'
      - '--output-signature=${signature}'
      - '--output-certificate=${certificate}'
      - '${artifact}'
    artifacts: checksum
    output: true

release:
  # Draft so a human reviews before publishing (matches the parked-PR discipline).
  draft: true
  prerelease: auto

snapshot:
  version_template: '{{ incpatch .Version }}-snapshot'

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
