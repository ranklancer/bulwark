<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bulwark</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel-2: #1c2128;
      --border: #30363d;
      --text: #e6edf3;
      --text-dim: #8b949e;
      --accent: #58a6ff;
      --safe: #3fb950;
      --review: #d29922;
      --breaking: #f85149;
      --rolled-back: #db61a2;
      --button: #21262d;
      --button-hover: #30363d;
      --button-primary: #1f6feb;
      --button-primary-hover: #388bfd;
      --button-danger: #da3633;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --panel: #f6f8fa;
        --panel-2: #ffffff;
        --border: #d0d7de;
        --text: #1f2328;
        --text-dim: #656d76;
        --button: #f6f8fa;
        --button-hover: #eef1f4;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }
    header .meta {
      color: var(--text-dim);
      font-size: 12px;
      margin-left: auto;
    }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }
    section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    section header.section-head {
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    section h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
    }
    section .section-meta {
      color: var(--text-dim);
      font-size: 12px;
      margin-left: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      text-align: left;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    th {
      color: var(--text-dim);
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    tr:last-child td { border-bottom: none; }
    .empty {
      padding: 24px;
      text-align: center;
      color: var(--text-dim);
      font-style: italic;
    }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .pill.safe     { background: rgba(63,185,80,0.15);  color: var(--safe); }
    .pill.review   { background: rgba(210,153,34,0.15); color: var(--review); }
    .pill.breaking { background: rgba(248,81,73,0.15);  color: var(--breaking); }
    .pill.pending  { background: rgba(139,148,158,0.15); color: var(--text-dim); }
    .pill.approved { background: rgba(63,185,80,0.15);  color: var(--safe); }
    .pill.rejected { background: rgba(219,97,162,0.15); color: var(--rolled-back); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .text-dim { color: var(--text-dim); }
    button {
      background: var(--button);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 10px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.1s;
    }
    button:hover { background: var(--button-hover); }
    button.primary {
      background: var(--button-primary);
      color: white;
      border-color: var(--button-primary);
    }
    button.primary:hover { background: var(--button-primary-hover); }
    button.danger {
      background: var(--button-danger);
      border-color: var(--button-danger);
      color: white;
    }
    button.danger:hover { filter: brightness(1.1); }
    button + button { margin-left: 4px; }
    input[type=password], input[type=text] {
      background: var(--button);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 8px;
      font: inherit;
      font-size: 13px;
      width: 200px;
    }
    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      transform: translateY(100px);
      opacity: 0;
      transition: transform 0.2s, opacity 0.2s;
      max-width: 360px;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.error { border-color: var(--breaking); }
    .toast.ok { border-color: var(--safe); }
  </style>
</head>
<body>
  <header>
    <h1>🛡  Bulwark</h1>
    <input type="password" id="token" placeholder="API token (optional)" />
    <button id="save-token">Save</button>
    <button id="refresh-now">Refresh</button>
    <span class="meta">
      <span id="last-refresh">–</span>
    </span>
  </header>

  <main>
    <section>
      <header class="section-head">
        <h2>Pending decisions</h2>
        <span id="queue-meta" class="section-meta"></span>
      </header>
      <div id="queue-body">
        <div class="empty">Loading…</div>
      </div>
    </section>

    <section>
      <header class="section-head">
        <h2>Recent scans</h2>
        <span id="scans-meta" class="section-meta"></span>
      </header>
      <div id="scans-body">
        <div class="empty">Loading…</div>
      </div>
    </section>

    <section>
      <header class="section-head">
        <h2>Notification dedup</h2>
        <span id="dedup-meta" class="section-meta"></span>
        <button id="clear-dedup" class="danger">Clear</button>
      </header>
      <div id="dedup-body">
        <div class="empty">Loading…</div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const tokenInput = $("#token");
  const tokenKey = "bulwark.token";
  tokenInput.value = localStorage.getItem(tokenKey) || "";

  $("#save-token").addEventListener("click", () => {
    localStorage.setItem(tokenKey, tokenInput.value);
    toast("ok", "Token saved");
    refreshAll();
  });
  $("#refresh-now").addEventListener("click", refreshAll);
  $("#clear-dedup").addEventListener("click", clearDedup);

  function authHeaders() {
    const t = tokenInput.value;
    return t ? { "Authorization": "Bearer " + t } : {};
  }

  async function api(method, path, body) {
    const opts = { method, headers: { ...authHeaders() } };
    if (body !== undefined) {
      opts.headers["Content-Type"] = "application/json";
      opts.body = JSON.stringify(body);
    }
    const r = await fetch(path, opts);
    let data = null;
    try { data = await r.json(); } catch (_) {}
    if (!r.ok) {
      const msg = (data && data.error) || (r.status + " " + r.statusText);
      throw new Error(msg);
    }
    return data;
  }

  function escapeHTML(s) {
    if (s === null || s === undefined) return "";
    return String(s)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");
  }

  function pill(level) {
    const cls = (level || "pending").toLowerCase();
    return `<span class="pill ${escapeHTML(cls)}">${escapeHTML(level || "pending")}</span>`;
  }

  function relativeTime(iso) {
    if (!iso) return "—";
    const t = new Date(iso).getTime();
    if (isNaN(t)) return iso;
    const diff = (Date.now() - t) / 1000;
    if (diff < 60) return Math.floor(diff) + "s ago";
    if (diff < 3600) return Math.floor(diff / 60) + "m ago";
    if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
    return Math.floor(diff / 86400) + "d ago";
  }

  function shortDigest(d) {
    if (!d) return "";
    const i = d.indexOf(":");
    if (i < 0 || d.length < i + 13) return d;
    return d.slice(0, i + 13) + "…";
  }

  // --- queue --------------------------------------------------------------

  async function loadQueue() {
    const body = $("#queue-body");
    const meta = $("#queue-meta");
    try {
      const rows = await api("GET", "/api/v1/queue");
      if (!rows || rows.length === 0) {
        body.innerHTML = `<div class="empty">No pending updates.</div>`;
        meta.textContent = "0";
        return;
      }
      const pending = rows.filter(r => r.decision === "pending").length;
      meta.textContent = `${rows.length} total · ${pending} pending`;
      body.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Container</th><th>Risk</th><th>Version</th>
              <th>Decision</th><th>Image</th><th></th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(r => `
              <tr>
                <td><strong>${escapeHTML(r.container)}</strong></td>
                <td>${pill(r.level)}</td>
                <td class="mono">${escapeHTML(r.from || "?")} → ${escapeHTML(r.to || "?")}</td>
                <td>${pill(r.decision)}${r.decided_by ? ` <span class="text-dim">by ${escapeHTML(r.decided_by)}</span>` : ""}</td>
                <td class="mono text-dim">${escapeHTML(r.image || "")}</td>
                <td>${
                  r.decision === "pending"
                    ? `<button class="primary" data-action="approve" data-container="${escapeHTML(r.container)}">Approve</button>` +
                      `<button class="danger" data-action="reject" data-container="${escapeHTML(r.container)}">Reject</button>`
                    : `<button data-action="forget" data-container="${escapeHTML(r.container)}">Forget</button>`
                }</td>
              </tr>`).join("")}
          </tbody>
        </table>`;
      body.querySelectorAll("button[data-action]").forEach(btn => {
        btn.addEventListener("click", (e) => onQueueAction(
          e.target.dataset.action, e.target.dataset.container,
        ));
      });
    } catch (err) {
      body.innerHTML = `<div class="empty">Could not load queue: ${escapeHTML(err.message)}</div>`;
    }
  }

  async function onQueueAction(action, container) {
    try {
      if (action === "approve" || action === "reject") {
        await api("POST", "/api/v1/queue", {
          container,
          decision: action === "approve" ? "approved" : "rejected",
          decided_by: "ui",
        });
        toast("ok", `${action}d: ${container}`);
      } else if (action === "forget") {
        await api("DELETE", `/api/v1/queue/${encodeURIComponent(container)}`);
        toast("ok", `Forgot decision for ${container}`);
      }
      await loadQueue();
    } catch (err) {
      toast("error", `${action} failed: ${err.message}`);
    }
  }

  // --- scans --------------------------------------------------------------

  async function loadScans() {
    const body = $("#scans-body");
    const meta = $("#scans-meta");
    try {
      const scans = await api("GET", "/api/v1/scans?limit=10");
      if (!scans || scans.length === 0) {
        body.innerHTML = `<div class="empty">No scans recorded yet.</div>`;
        meta.textContent = "0";
        return;
      }
      meta.textContent = `${scans.length} recent`;
      body.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Started</th><th>Total</th>
              <th>Pending</th><th>Breaking</th><th>Review</th><th>Safe</th>
              <th>Skipped</th><th>Errors</th>
            </tr>
          </thead>
          <tbody>
            ${scans.map(s => `
              <tr>
                <td>${escapeHTML(relativeTime(s.started_at))}<br>
                    <span class="text-dim mono">${escapeHTML(s.id || "")}</span></td>
                <td>${s.summary?.total ?? 0}</td>
                <td>${s.summary?.pending ?? 0}</td>
                <td>${s.summary?.breaking ?? 0}</td>
                <td>${s.summary?.review ?? 0}</td>
                <td>${s.summary?.safe ?? 0}</td>
                <td>${s.summary?.skipped ?? 0}</td>
                <td>${s.summary?.errored ?? 0}</td>
              </tr>`).join("")}
          </tbody>
        </table>`;
    } catch (err) {
      body.innerHTML = `<div class="empty">Could not load scans: ${escapeHTML(err.message)}</div>`;
    }
  }

  // --- dedup --------------------------------------------------------------

  async function loadDedup() {
    const body = $("#dedup-body");
    const meta = $("#dedup-meta");
    try {
      const rows = await api("GET", "/api/v1/notifications");
      if (!rows || rows.length === 0) {
        body.innerHTML = `<div class="empty">No silenced notifications.</div>`;
        meta.textContent = "0";
        return;
      }
      meta.textContent = `${rows.length}`;
      body.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Container</th><th>Risk</th><th>Last notified</th>
              <th>Count</th><th>Digest</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(n => `
              <tr>
                <td>${escapeHTML(n.container_name || n.container_id || "")}</td>
                <td>${pill(n.level)}</td>
                <td>${escapeHTML(relativeTime(n.last_notified))}</td>
                <td>${n.count ?? 0}</td>
                <td class="mono text-dim">${escapeHTML(shortDigest(n.registry_digest))}</td>
              </tr>`).join("")}
          </tbody>
        </table>`;
    } catch (err) {
      body.innerHTML = `<div class="empty">Could not load dedup: ${escapeHTML(err.message)}</div>`;
    }
  }

  async function clearDedup() {
    if (!confirm("Clear all dedup state? Next scan will re-notify everything.")) return;
    try {
      await api("DELETE", "/api/v1/notifications");
      toast("ok", "Dedup cleared");
      loadDedup();
    } catch (err) {
      toast("error", "Clear failed: " + err.message);
    }
  }

  // --- toast --------------------------------------------------------------

  let toastTimer = null;
  function toast(kind, msg) {
    const el = $("#toast");
    el.className = "toast show " + kind;
    el.textContent = msg;
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = "toast"; }, 3000);
  }

  // --- refresh loop -------------------------------------------------------

  async function refreshAll() {
    await Promise.allSettled([loadQueue(), loadScans(), loadDedup()]);
    $("#last-refresh").textContent = "refreshed " + new Date().toLocaleTimeString();
  }

  refreshAll();
  setInterval(refreshAll, 30_000);
})();
</script>
</body>
</html>
