name: release

# Builds and publishes the multi-arch Bulwark image to GHCR. Two
# triggers:
#
#   * push: tags starting with "v" — produces immutable version tags
#     (e.g. v0.1.0 → ghcr.io/<owner>/bulwark:0.1.0 and :0.1).
#   * push to main — updates ghcr.io/<owner>/bulwark:latest.
#
# Operators in production should pin to a versioned tag, not :latest.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: build & push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the Vite + Go build sees the React source under
          # web/ and the embed directory under internal/api/ui-react/.
          # Default checkout depth is fine.
          fetch-depth: 1

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/metadata-action handles tag inference: semver from the
      # git ref for "v*" tags, plus :latest only when the push is to
      # the default branch (main). The is_default_branch guard keeps a
      # tag push from also moving :latest.
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          # OCI image labels expected by tools like `crane manifest`:
          labels: |
            org.opencontainers.image.title=Bulwark
            org.opencontainers.image.description=Intelligent Docker container update guardian.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      # Multi-arch build: amd64 covers most servers; arm64 covers Pi /
      # ARM SBC homelabs and Apple Silicon test rigs. Cross-compilation
      # via buildx is acceptable here because the binary is fully Go
      # (CGO_ENABLED=0) and Vite is platform-agnostic.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.repository.updated_at }}
          # GitHub Actions cache for buildx layers — keeps the npm
          # install + Go module download warm across runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Pushed ${{ steps.meta.outputs.tags }}"
