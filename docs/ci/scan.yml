# ─────────────────────────────────────────────────────────────────────────────
# STAGED WORKFLOW — NOT ACTIVE HERE. Copy to .github/workflows/scan.yml with a
# workflow-scoped token (bulwark-ci is contents-only; see docs/ci/README.md).
#
# Static-analysis + supply-chain scan gate, mirroring `make gate-full` + the
# advisory tools. Pinned tool versions (never @latest — the repo targets Go 1.22
# and @latest golangci-lint/govulncheck demand Go >= 1.23).
# ─────────────────────────────────────────────────────────────────────────────
name: scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: '1.22'
  GOLANGCI_LINT_VERSION: 'v1.61.0'
  GOVULNCHECK_VERSION: 'v1.1.4'
  GOSEC_VERSION: 'v2.20.0'

jobs:
  scan:
    name: lint + gosec + govulncheck
    runs-on: ubuntu-latest
    steps:
      # TODO(security): SHA-pin these third-party actions — see docs/ci/README.md.
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: golangci-lint (blocking)
        uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: gosec (blocking — currently 0 findings)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}
          "$(go env GOPATH)/bin/gosec" -quiet ./...

      - name: govulncheck (advisory)
        # Advisory: on Go 1.22 this also reports stdlib CVEs fixed only in later
        # Go patch releases, which are a toolchain-bump decision, not a repo fix.
        # Make it blocking once the CI Go version is bumped (see README).
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          "$(go env GOPATH)/bin/govulncheck" ./...
