# STAGED — copy to .github/workflows/scorecard.yml with a workflow-scoped token.
# Token-gated OpenSSF Scorecard supply-chain grader (branch protection, pinned
# deps, token perms, dangerous workflows, ...). Publishes to the Scorecard API.
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '30 6 * * 1'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
